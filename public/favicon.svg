<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo escuro estilizado com cantos arredondados -->
  <rect width="64" height="64" rx="14" fill="#030607"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#20d6c7" stroke-width="1.8" stroke-opacity="0.85"/>
  
  <!-- Linha de topo de janela / terminal -->
  <circle cx="12" cy="12" r="2.2" fill="#ef4444" opacity="0.85"/>
  <circle cx="18" cy="12" r="2.2" fill="#eab308" opacity="0.85"/>
  <circle cx="24" cy="12" r="2.2" fill="#22c55e" opacity="0.85"/>
  <line x1="6" y1="19" x2="58" y2="19" stroke="#20d6c7" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Prompt de Terminal > -->
  <path d="M12 28L20 34L12 40" stroke="#20d6c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Cilindro de Banco de Dados / Telemetria -->
  <!-- Topo do disco -->
  <ellipse cx="42" cy="27" rx="12" ry="4.5" fill="#0b1b1e" stroke="#20d6c7" stroke-width="2"/>
  
  <!-- Segundo nível do disco -->
  <path d="M30 27v6c0 2.5 5.37 4.5 12 4.5s12-2 12-4.5v-6" stroke="#20d6c7" stroke-width="2" fill="none"/>
  
  <!-- Base do disco -->
  <path d="M30 33v6c0 2.5 5.37 4.5 12 4.5s12-2 12-4.5v-6" stroke="#20d6c7" stroke-width="2" fill="none"/>

  <!-- Cursor piscante _ -->
  <line x1="22" y1="40" x2="28" y2="40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>
